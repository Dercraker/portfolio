name: Scrape LinkedIn Posts

on:
  schedule:
    - cron: "0 12 1/2 * *" # Un jour sur deux à 12h
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          pnpm install
          npx playwright install --with-deps

      - name: Run scraper
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: pnpm tsx scripts/scrape-linkedin.ts

      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add linkedin-posts.json
          git commit -m "chore: update LinkedIn posts [bot]" || echo "No changes"
          git push
